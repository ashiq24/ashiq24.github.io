# about me
first-paragraph: I am a final-year Ph.D. candidate in Computer Science at Purdue University, advised by Professor Raymond A. Yeh, and a Bilsland Dissertation Fellow. I received my bachelor's degree in Computer Science and Engineering from the Bangladesh University of Engineering and Technology (BUET), where I worked with Professor Md. Shamsuzzoha Bayzid.
second-paragraph: <b class="job-market">I am on the 2026–27 job market, available Spring 2027.</b>
research-introduction: I design robust, physically grounded AI systems by building the structure of the real world (symmetry, physics, and embodiment) into modern foundation models.

research-interests:

  - field: Symmetry & Robustness
    subfields: Geometric deep learning, Provably robust AI systems

  - field: Scientific Machine Learning
    subfields: Neural operators, Physics foundation models, Multiphysics and weather surrogates

  - field: Multimodal & Embodied AI
    subfields: Multimodal LLMs and agents, Efficient vision-language-action models (VLAs)

