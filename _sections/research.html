<!-- Research section -->

<hr class="my-1">
<div class="row" id="research">
    <div class="col">
        <div class="publications-header-wrap">
            <h2 class="mb-2 mt-1">Publications</h2>
            <div class="publication-view-switch" id="pub-view-switch">
                <button type="button" class="view-switch-btn active" data-view="featured" id="btn-view-featured" title="Show recent publications">
                    <i class="fa fa-star"></i> <span>Recent Papers</span>
                </button>
                <button type="button" class="view-switch-btn" data-view="all" id="btn-view-all" title="Show all publications">
                    <i class="fa fa-th-list"></i> <span>All Papers</span>
                </button>
            </div>
        </div>

        <div class="publications-toolbar">
            <div id="filters-project">
                <button class="filter-button active" data-filter="*">all</button>
                {% for category in site.data.research.categories %}
                <button class="filter-button" data-filter="{{ category.data-filter }}">{{ category.category-name }}</button>
                {% endfor %}
            </div>
        </div>

        <p></p>
        <div id="projects" class="isotope">
            {% for project in site.data.research.projects %}
            {% include_relative _libs/research_widget.html %}
            {% endfor %}
        </div>

        <!-- Modern In-Place Show Remaining Expansion Widget -->
        <div class="publications-expand-container" id="pub-expand-container">
            <button type="button" class="btn-expand-publications" id="btn-load-more-projects">
                <span class="expand-text">Show Remaining</span>
                <i class="fa fa-chevron-down expand-chevron"></i>
            </button>
        </div>
        <p></p>
    </div>
</div>
